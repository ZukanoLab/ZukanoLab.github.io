<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おいかけっ碁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* レイアウト: 盤を中心に据えた縦長1カラム。ホームは上にロゴと遊び方、下にステージ一覧。
   単一の夜の盤テーマ（ゲームとして意図的に1つの見た目に固定） */
:root {
  --night: #171A33;
  --panel: #222750;
  --panel-2: #2E3566;
  --line: #3B4380;
  --ink: #F4F1FF;
  --ink-dim: #B2B6DE;
  --gold: #FFD04A;
  --gold-deep: #B87A00;
  --coral: #FF5C6C;
  --mint: #4FE3B2;
  --sakura: #FF8FB8;
  --honey: #E8BA63;
  --f-display: 'Dela Gothic One', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  --f-body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 55% at 50% -8%, rgba(98, 108, 220, .38), transparent 62%), var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.6;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
h1, h2, p, ol { margin: 0; }
svg { display: block; }
svg[hidden] { display: none !important; }

#app { max-width: 560px; margin: 0 auto; }
.screen { display: flex; flex-direction: column; gap: 18px; }
.screen[hidden] { display: none !important; }

/* ---------- ホーム ---------- */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 6px; }
.hero-text { min-width: 0; }
.logo {
  font-family: var(--f-display); font-weight: 400;
  font-size: clamp(46px, 14.5vw, 84px); line-height: 1; letter-spacing: .02em; white-space: nowrap;
  color: var(--gold);
  text-shadow: 0 4px 0 var(--gold-deep), 0 9px 0 rgba(0, 0, 0, .28), 0 0 34px rgba(255, 208, 74, .35);
}
.tag { margin-top: 18px; color: var(--ink-dim); font-weight: 700; font-size: 14px; }
.hero-art { width: clamp(96px, 28vw, 140px); flex: none; filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .45)); border-radius: 16px; }
.h-target { animation: htarget 4s infinite; transform-box: fill-box; transform-origin: center; }
.h-drop { transform-box: fill-box; transform-origin: center; animation: hdrop 4s infinite; }
.h-white { transform-box: fill-box; transform-origin: center; animation: hwhite 4s infinite; }
@keyframes htarget { 0%, 40% { opacity: .35; transform: scale(.8); } 20% { opacity: 1; transform: scale(1.25); } 42%, 100% { opacity: 0; } }
@keyframes hdrop { 0%, 38% { transform: scale(0); opacity: 0; } 42% { transform: scale(1.25); opacity: 1; } 47%, 92% { transform: scale(1); opacity: 1; } 96%, 100% { transform: scale(0); opacity: 0; } }
@keyframes hwhite { 0%, 48% { transform: scale(1); opacity: 1; } 58% { transform: scale(1.6); opacity: 0; } 94% { transform: scale(1.6); opacity: 0; } 96% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.cta { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; }
.btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-height: 60px; padding: 10px 14px; border-radius: 20px;
  font-weight: 900; font-size: 19px; line-height: 1.25;
  transition: transform .08s, box-shadow .08s;
}
.btn small { font-size: 12px; font-weight: 700; opacity: .78; }
.btn-wide { grid-column: 1 / -1; flex-direction: row; gap: 12px; }
.btn-wide small { opacity: .7; }
.btn-gold { background: linear-gradient(#FFE27F, #FFC531); color: #3B2600; box-shadow: 0 5px 0 var(--gold-deep), 0 12px 20px rgba(0, 0, 0, .35); }
.btn-gold:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-deep), 0 4px 10px rgba(0, 0, 0, .35); }
.btn-ghost { background: var(--panel-2); box-shadow: 0 5px 0 #1A1F4A, 0 12px 20px rgba(0, 0, 0, .3); }
.btn-ghost:active { transform: translateY(4px); box-shadow: 0 1px 0 #1A1F4A, 0 4px 10px rgba(0, 0, 0, .3); }

.panel { background: var(--panel); border-radius: 22px; padding: 16px 18px; }
.how h2, .sec-head h2 { font-size: 15px; font-weight: 900; letter-spacing: .08em; color: var(--ink-dim); }
.how ol { margin-top: 8px; padding-left: 1.3em; display: grid; gap: 4px; }
.how li::marker { color: var(--gold); font-weight: 900; }
.note { margin-top: 8px; font-size: 13px; color: var(--ink-dim); }
.sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.startotal { display: flex; align-items: center; gap: 5px; font-weight: 900; font-variant-numeric: tabular-nums; }
.star-ic { width: 18px; height: 18px; fill: var(--gold); }

.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile {
  aspect-ratio: 1; border-radius: 18px; background: var(--panel);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  box-shadow: inset 0 0 0 2px var(--line); transition: transform .08s;
}
.tile:active { transform: scale(.94); }
.tile b { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile.next { box-shadow: inset 0 0 0 3px var(--gold), 0 0 22px rgba(255, 208, 74, .32); }
.stars { display: flex; gap: 2px; }
.stars svg { width: 13px; height: 13px; fill: #3A4180; }
.stars svg.on { fill: var(--gold); }

/* ---------- プレイ画面 ---------- */
.bar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.bar-title { text-align: center; font-family: var(--f-display); font-size: 22px; letter-spacing: .04em; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--panel); display: grid; place-items: center; }
.icon-btn svg, .tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.caption { background: var(--panel); border-radius: 16px; padding: 10px 14px; font-size: 14px; font-weight: 700; color: var(--ink); min-height: 3.4em; display: flex; align-items: center; }

.hud { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; }
.hud-goal { min-width: 0; }
.label { font-size: 13px; font-weight: 700; color: var(--ink-dim); }
#goal-label { font-size: 16px; color: var(--ink); font-weight: 900; margin-bottom: 6px; }
#goal-label b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
.meter { height: 12px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--mint), var(--gold)); transition: width .45s cubic-bezier(.2, 1.4, .4, 1); }
.hud-moves { text-align: right; }
.pips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 150px; margin-top: 6px; min-height: 16px; }
.pips i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5A6090, #0C0E1E 70%); box-shadow: 0 2px 0 rgba(0, 0, 0, .35); transition: transform .2s, opacity .2s; }
.pips i.used { background: transparent; box-shadow: inset 0 0 0 2px var(--line); transform: scale(.8); }
.timer { font-family: var(--f-display); font-size: 36px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; display: none; }
.timer.low { color: var(--coral); animation: throb .5s infinite alternate; }
@keyframes throb { to { transform: scale(1.12); } }
[data-mode="rush"] .timer { display: block; }
[data-mode="rush"] .pips, [data-mode="rush"] .hud-moves .label { display: none; }

.board-wrap {
  position: relative; margin-inline: auto; aspect-ratio: 1;
  width: min(100%, 520px, max(280px, calc(100dvh - 380px)));
  border-radius: 18px; overflow: hidden;
  box-shadow: 0 0 0 4px #A87326, 0 0 0 7px #5B3C12, 0 20px 40px rgba(0, 0, 0, .5);
  touch-action: manipulation; background: var(--honey);
}
.board-wrap.flash { animation: flash .55s ease-out; }
@keyframes flash {
  0% { box-shadow: 0 0 0 4px #A87326, 0 0 0 7px #5B3C12, 0 0 70px 22px rgba(255, 208, 74, .95); }
  100% { box-shadow: 0 0 0 4px #A87326, 0 0 0 7px #5B3C12, 0 20px 40px rgba(0, 0, 0, .5); }
}
#board { width: 100%; height: 100%; display: block; cursor: pointer; }
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop { position: absolute; white-space: nowrap; font-family: var(--f-display); text-align: center; transform: translate(-50%, -50%); will-change: transform, opacity; }
.pop.big {
  left: 50%; top: 40%; font-size: clamp(34px, 10.5vw, 58px); color: var(--gold);
  text-shadow: 0 3px 0 #9A5B00, 0 7px 0 rgba(0, 0, 0, .25), 0 0 26px rgba(255, 208, 74, .75);
  animation: bigpop 1s cubic-bezier(.2, 1.3, .3, 1) both;
}
@keyframes bigpop {
  0% { transform: translate(-50%, -50%) scale(.3) rotate(-8deg); opacity: 0; }
  18% { transform: translate(-50%, -50%) scale(1.28) rotate(3deg); opacity: 1; }
  34% { transform: translate(-50%, -50%) scale(1) rotate(-1deg); }
  78% { opacity: 1; }
  100% { transform: translate(-50%, -66%) scale(1); opacity: 0; }
}
.pop.epic { top: 24%; font-size: clamp(28px, 8.4vw, 50px); color: #fff; background: linear-gradient(90deg, #FFD04A, #FF8FB8, #8FB4FF, #4FE3B2, #FFD04A); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 4px 0 #7A4300) drop-shadow(0 0 22px rgba(255, 208, 74, .9)); animation: epicpop 2.4s cubic-bezier(.2, 1.3, .3, 1) both, epichue 1.2s linear infinite; }
@keyframes epicpop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-10deg); opacity: 0; } 12% { transform: translate(-50%, -50%) scale(1.45) rotate(4deg); opacity: 1; } 24% { transform: translate(-50%, -50%) scale(1.1) rotate(-2deg); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { transform: translate(-50%, -80%) scale(1.15); opacity: 0; } }
@keyframes epichue { to { background-position: 300% 0; } }
.pop.pts { font-size: 22px; color: #fff; text-shadow: 0 2px 0 rgba(70, 35, 0, .8), 0 0 12px rgba(255, 208, 74, .95); animation: ptsup 1.1s ease-out both; }
@keyframes ptsup { 0% { transform: translate(-50%, -30%) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { transform: translate(-50%, -200%) scale(1); opacity: 0; } }
.pop.warn { font-size: 20px; color: #fff; background: var(--coral); padding: 1px 14px 3px; border-radius: 999px; box-shadow: 0 3px 0 #A52B38; animation: warn .95s ease-out both; }
@keyframes warn { 0% { transform: translate(-50%, -20%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -90%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(1); opacity: 0; } }
.toast {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: 92%;
  background: rgba(23, 26, 51, .94); color: var(--ink); padding: 8px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; text-align: center;
}
.toast.show { animation: toast 2.2s ease both; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

.score-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px; }
.score { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 900; color: var(--ink-dim); letter-spacing: .1em; }
#score { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.combo { font-family: var(--f-display); font-size: 20px; color: var(--sakura); text-shadow: 0 2px 0 rgba(0, 0, 0, .3); min-height: 1.2em; }
.combo.bump { animation: bump .35s cubic-bezier(.2, 1.8, .4, 1); }
@keyframes bump { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px;
  border-radius: 16px; background: var(--panel); font-size: 12px; font-weight: 900; color: var(--ink);
  box-shadow: 0 4px 0 #161A40; transition: transform .08s, box-shadow .08s;
}
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #161A40; }
.tool[disabled] { opacity: .38; pointer-events: none; }
.tool.t-hint svg { stroke: var(--mint); }
.tool[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--mint), 0 4px 0 #161A40; }
.tool[aria-pressed="true"] svg { stroke: var(--mint); }
[data-mode="ladder"] .hud { grid-template-columns: minmax(0, 1fr); }
[data-mode="ladder"] .hud-moves, [data-mode="ladder"] .meter { display: none; }
[data-mode="ladder"] #goal-label { margin-bottom: 0; }
[data-mode="rush"] .t-undo, [data-mode="rush"] .t-hint, [data-mode="rush"] .t-retry { display: none; }
[data-mode="rush"] .tools { grid-template-columns: minmax(0, 140px); justify-content: center; }

/* ---------- モーダル ---------- */
.modal {
  position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(10, 12, 32, .74); animation: fade .2s ease both;
}
.modal[hidden] { display: none !important; }
@keyframes fade { from { opacity: 0; } }
.card {
  width: min(100%, 400px); max-height: 100%; overflow: auto; background: var(--panel); border-radius: 28px;
  padding: 24px 20px 20px; text-align: center; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 0 0 3px var(--line), 0 26px 60px rgba(0, 0, 0, .6);
  animation: rise .4s cubic-bezier(.2, 1.3, .4, 1) both;
}
@keyframes rise { from { transform: translateY(30px) scale(.92); opacity: 0; } }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 32px; line-height: 1.2; color: var(--gold); text-shadow: 0 3px 0 rgba(0, 0, 0, .3); }
.card .sub { color: var(--ink-dim); font-weight: 700; font-size: 14px; }
.bigstars { display: flex; justify-content: center; gap: 8px; }
.bigstars svg { width: 62px; height: 62px; fill: #3A4180; }
.bigstars svg:nth-child(2) { transform: translateY(-8px); }
.bigstars svg.on { fill: var(--gold); filter: drop-shadow(0 0 14px rgba(255, 208, 74, .8)); animation: starin .55s cubic-bezier(.2, 1.7, .4, 1) both; }
@keyframes starin { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
.resline { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 14px; background: var(--panel-2); border-radius: 14px; font-weight: 700; }
.resline b { font-family: var(--f-display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.card .btns { display: grid; gap: 12px; margin-top: 4px; }
.card .btn { font-size: 18px; min-height: 54px; }
.newbest { color: var(--sakura); font-family: var(--f-display); font-size: 20px; animation: throb .6s infinite alternate; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

@media (prefers-reduced-motion: reduce) {
  .h-target, .h-drop, .h-white, .timer.low, .newbest { animation: none; }
  .pop.big, .pop.pts, .pop.warn { animation-duration: .6s; animation-name: fadepop; }
  .pop.epic { animation-duration: 1.2s; animation-name: fadepop; }
  .board-wrap.flash { animation: none; }
  .card, .modal { animation: none; }
}
@keyframes fadepop { 0% { opacity: 0; } 20%, 70% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- 2ページ構成 ---------- */
.btn[hidden] { display: none !important; }
a.btn { text-decoration: none; color: inherit; }
.logo.long { font-size: clamp(28px, 8.6vw, 50px); letter-spacing: .01em; }
.cta.single { grid-template-columns: minmax(0, 1fr); }

/* ---------- おいかけの基本 ---------- */
.st-new { transform-box: fill-box; transform-origin: center; animation: stpop .38s cubic-bezier(.2, 1.6, .4, 1) both; }
.st-gone { transform-box: fill-box; transform-origin: center; animation: stgone .6s ease-out forwards; }
.st-lib { animation: stlib 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes stpop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes stgone { 0% { transform: scale(1); opacity: 1; } 35% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(.2); opacity: 0; } }
@keyframes stlib { from { transform: scale(.75); opacity: .75; } to { transform: scale(1.1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .st-new, .st-gone, .st-lib { animation: none; } .st-gone { display: none; } }

.basic-top { display: grid; gap: 12px; }
.lesson { display: grid; gap: 12px; }
.lesson p { line-height: 1.75; font-size: 15px; }
.lesson p + p { margin-top: 8px; }
.lesson.intro p { font-size: 15px; }
.l-head { display: flex; align-items: center; gap: 10px; }
.l-head h2 { font-size: 18px; font-weight: 900; line-height: 1.3; }
.l-no { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 15px; background: var(--gold); color: #3B2600; }
.kdot { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin: 0 .25em 0 .1em; vertical-align: baseline; }
.kdot.g { background: #128F6E; box-shadow: 0 0 0 2px rgba(79, 227, 178, .35); }
.kdot.r { background: var(--coral); box-shadow: 0 0 0 2px rgba(255, 92, 108, .35); }
.demo { display: grid; gap: 10px; }
.demo-bwrap { width: min(100%, 360px); margin: 0 auto; border-radius: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, .4); cursor: pointer; line-height: 0; }
.demo-board { width: 100%; height: auto; display: block; border-radius: 12px; }
.demo-cap { background: var(--panel-2); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 14px; line-height: 1.6; min-height: 3.6em; display: flex; align-items: center; }
.demo-cap.ok { box-shadow: inset 0 0 0 2px var(--mint); }
.demo-cap.ng { box-shadow: inset 0 0 0 2px var(--coral); }
.demo-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.demo-dots { display: flex; gap: 5px; width: 100%; justify-content: center; flex-wrap: wrap; }
.demo-dots:has(i:only-child) { display: none; }
.demo-dots i { width: 8px; height: 8px; border-radius: 50%; background: #323873; }
.demo-dots i.done { background: #6B72C4; }
.demo-dots i.on { background: var(--gold); transform: scale(1.3); }
.demo-b { min-height: 44px; padding: 0 16px; border-radius: 14px; background: var(--panel-2); font-weight: 900; font-size: 14px; box-shadow: 0 3px 0 #1A1F4A; }
.demo-b:active { transform: translateY(2px); box-shadow: 0 1px 0 #1A1F4A; }
.demo-b:disabled { opacity: .35; }
.demo-next { background: linear-gradient(#FFE27F, #FFC531); color: #3B2600; box-shadow: 0 3px 0 var(--gold-deep); }
.tips { padding-left: 1.3em; display: grid; gap: 8px; line-height: 1.7; font-size: 15px; }
.tips li::marker { color: var(--gold); font-weight: 900; }
.lesson .btn { margin-top: 6px; }

.lv-head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-top: 10px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.1); }
.lv-head:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.lv-head b { font-family: var(--f-display); font-weight: 400; font-size: 13px; letter-spacing: .1em; color: var(--gold); }
.lv-head strong { font-size: 16px; font-weight: 900; }
.lv-head span { flex-basis: 100%; font-size: 12px; font-weight: 700; opacity: .65; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.4l2.95 6.2 6.75.85-4.98 4.7 1.3 6.7L12 17.5l-6.02 3.35 1.3-6.7-4.98-4.7 6.75-.85z"/></symbol>
</svg>

<main id="app">
  <!-- ホーム -->
  <section id="home" class="screen">
    <div class="hero">

<script>
/* ポン碁 ロジック: 盤面・捕獲・ソルバー・ステージ生成（ブラウザとNodeの両方で動く） */
(function (root) {
  'use strict';
  var EMPTY = 0, BLACK = 1, WHITE = 2;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function popcount(x) {
    x = x - ((x >>> 1) & 0x55555555);
    x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
    return Math.imul((x + (x >>> 4)) & 0x0F0F0F0F, 0x01010101) >>> 24;
  }

  function neighbors(N, i) {
    var r = (i / N) | 0, c = i % N, out = [];
    if (r > 0) out.push(i - N);
    if (r < N - 1) out.push(i + N);
    if (c > 0) out.push(i - 1);
    if (c < N - 1) out.push(i + 1);
    return out;
  }

  /* start を含む白の連と、その息（空点）を返す */
  /* 黒石のつながり全体の息の数 */
  function blackLibs(N, board, start) {
    var seen = new Set([start]), stack = [start], libs = new Set();
    while (stack.length) {
      var p = stack.pop(), nb = neighbors(N, p);
      for (var k = 0; k < nb.length; k++) {
        var q = nb[k];
        if (board[q] === BLACK) { if (!seen.has(q)) { seen.add(q); stack.push(q); } }
        else if (board[q] === EMPTY) libs.add(q);
      }
    }
    return libs.size;
  }
  function groupAt(N, board, start) {
    var stones = [], libs = new Set(), seen = new Set([start]), stack = [start];
    while (stack.length) {
      var p = stack.pop();
      stones.push(p);
      var nb = neighbors(N, p);
      for (var k = 0; k < nb.length; k++) {
        var q = nb[k];
        if (board[q] === WHITE) {
          if (!seen.has(q)) { seen.add(q); stack.push(q); }
        } else if (board[q] === EMPTY) {
          libs.add(q);
        }
      }
    }
    return { stones: stones, libs: Array.from(libs) };
  }

  function whiteGroups(N, board) {
    var seen = new Uint8Array(N * N), groups = [];
    for (var i = 0; i < N * N; i++) {
      if (board[i] !== WHITE || seen[i]) continue;
      var g = groupAt(N, board, i);
      g.stones.forEach(function (s) { seen[s] = 1; });
      groups.push(g);
    }
    return groups;
  }

  /* 黒を置く。息のなくなった白の連を取り除き、取った連（石の配列）を返す。黒石は取られない */
  function playBlack(N, board, p) {
    board[p] = BLACK;
    var captured = [], seen = new Set();
    var nb = neighbors(N, p);
    for (var k = 0; k < nb.length; k++) {
      var q = nb[k];
      if (board[q] !== WHITE || seen.has(q)) continue;
      var g = groupAt(N, board, q);
      g.stones.forEach(function (s) { seen.add(s); });
      if (g.libs.length === 0) captured.push(g.stones);
    }
    captured.forEach(function (st) { st.forEach(function (s) { board[s] = EMPTY; }); });
    return captured;
  }

  /* 候補点（白に接する空点）と、連ごとの息ビットマスク */
  function analyze(N, board) {
    var groups = whiteGroups(N, board), cand = [], idx = new Map(), total = 0;
    groups.forEach(function (g) {
      g.libs.forEach(function (l) { if (!idx.has(l)) { idx.set(l, cand.length); cand.push(l); } });
    });
    var info = groups.map(function (g) {
      total += g.stones.length;
      var mask = 0;
      g.libs.forEach(function (l) { mask |= (1 << idx.get(l)); });
      return { stones: g.stones.length, mask: mask, libs: g.libs, first: g.stones[0] };
    });
    return { N: N, groups: info, cand: cand, totalStones: total };
  }

  /* k手で取れる白石の最大数と、その打ち方（ビットマスク）を全列挙で求める */
  function bestByCount(an) {
    var n = an.cand.length;
    var best = new Int32Array(n + 1).fill(-1), bestMask = new Int32Array(n + 1);
    var gm = an.groups.map(function (g) { return g.mask; });
    var gs = an.groups.map(function (g) { return g.stones; });
    var gl = gm.length, total = 1 << n;
    for (var m = 0; m < total; m++) {
      var k = popcount(m), cap = 0;
      for (var j = 0; j < gl; j++) if ((gm[j] & m) === gm[j]) cap += gs[j];
      if (cap > best[k]) { best[k] = cap; bestMask[k] = m; }
    }
    for (var k2 = 1; k2 <= n; k2++) {
      if (best[k2 - 1] >= best[k2]) { best[k2] = best[k2 - 1]; bestMask[k2] = bestMask[k2 - 1]; }
    }
    return { bestAt: best, maskAt: bestMask };
  }

  function firstK(bestAt, need) {
    for (var k = 0; k < bestAt.length; k++) if (bestAt[k] >= need) return k;
    return -1;
  }

  /* あと need 個取るのに maxMoves 手以内で足りるか。足りれば最小の打ち方を返す */
  function solveFor(an, need, maxMoves) {
    if (need <= 0) return { k: 0, mask: 0 };
    var bc = bestByCount(an);
    var k = firstK(bc.bestAt, need);
    if (k < 0 || k > maxMoves) return null;
    var mask = bc.maskAt[k];
    return { k: popcount(mask), mask: mask };
  }

  function maskPoints(an, mask) {
    var out = [];
    for (var i = 0; i < an.cand.length; i++) if (mask & (1 << i)) out.push(an.cand[i]);
    return out;
  }

  /* ---------- ステージ生成 ---------- */
  function generate(P, seed) {
    var rnd = mulberry32(seed);
    var ri = function (a, b) { return a + Math.floor(rnd() * (b - a + 1)); };
    var shuffle = function (arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(rnd() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    };
    var N = P.N, NN = N * N, maxCand = P.maxCand || 16;

    for (var attempt = 0; attempt < 300; attempt++) {
      var board = new Uint8Array(NN), gid = new Int16Array(NN).fill(-1);
      var g = ri(P.groups[0], P.groups[1]), stonesOf = [], ok = true;

      for (var k = 0; k < g && ok; k++) {
        var order = shuffle(Array.from({ length: NN }, function (_, i) { return i; }));
        var start = -1;
        for (var oi = 0; oi < order.length; oi++) {
          var p = order[oi];
          if (board[p] !== EMPTY) continue;
          if (neighbors(N, p).some(function (q) { return board[q] === WHITE; })) continue;
          start = p; break;
        }
        if (start < 0) { ok = false; break; }
        var size = ri(P.size[0], P.size[1]);
        var st = [start]; board[start] = WHITE; gid[start] = k;
        var guard = 0;
        while (st.length < size && guard++ < 60) {
          var base = st[ri(0, st.length - 1)];
          var nbs = shuffle(neighbors(N, base));
          for (var ni = 0; ni < nbs.length; ni++) {
            var c = nbs[ni];
            if (board[c] !== EMPTY) continue;
            var touchesOther = neighbors(N, c).some(function (d) { return board[d] === WHITE && gid[d] !== k; });
            if (touchesOther) continue;
            board[c] = WHITE; gid[c] = k; st.push(c); break;
          }
        }
        stonesOf.push(st);
      }
      if (!ok) continue;

      var nbrOf = stonesOf.map(function (st2) {
        var s = new Set();
        st2.forEach(function (p2) { neighbors(N, p2).forEach(function (q) { if (board[q] === EMPTY) s.add(q); }); });
        return Array.from(s);
      });
      var count = new Map();
      nbrOf.forEach(function (a) { a.forEach(function (q) { count.set(q, (count.get(q) || 0) + 1); }); });
      var keep = new Set();
      count.forEach(function (cnt, q) { if (cnt >= 2 && rnd() < P.shared) keep.add(q); });
      var bad = false;
      nbrOf.forEach(function (a) {
        var want = ri(P.libs[0], P.libs[1]);
        var have = a.filter(function (q) { return keep.has(q); }).length;
        var rest = shuffle(a.filter(function (q) { return !keep.has(q); }));
        while (have < Math.min(want, a.length) && rest.length) { keep.add(rest.pop()); have++; }
        if (have < 1) bad = true;
      });
      if (bad) continue;

      nbrOf.forEach(function (a) { a.forEach(function (q) { if (!keep.has(q)) board[q] = BLACK; }); });
      var decoys = P.decoys || 0, tries = 0;
      while (decoys > 0 && tries++ < 80) {
        var dp = ri(0, NN - 1);
        if (board[dp] === EMPTY && !keep.has(dp)) { board[dp] = BLACK; decoys--; }
      }

      var an = analyze(N, board);
      var L = an.cand.length;
      if (L < 1 || L > maxCand || (P.minCand && L < P.minCand)) continue;
      var W = an.totalStones;
      var target, par, limit;
      if (P.mode === 'all') {
        /* ぜんぶ取るには全ての息を埋める必要があるので、最短手数は息の総数 */
        target = W; par = L; limit = par + P.slack;
      } else {
        var bc = bestByCount(an);
        var d = ri(P.deficit[0], P.deficit[1]), M = L - d;
        if (M < 2) continue;
        target = bc.bestAt[M];
        if (target >= W || target <= 0) continue;
        par = firstK(bc.bestAt, target);
        if (par < 2 || (P.parMin && par < P.parMin)) continue;
        limit = par + P.slack;
      }
      return {
        N: N, cells: Array.from(board), target: target, limit: limit, par: par,
        total: W, libsTotal: L, mode: P.mode
      };
    }
    return null;
  }

  /* ---------- 手作りステージ ---------- */
  var HAND = [
    { rows: ['.....', '..X..', '.XOX.', '.....', '.....'], target: 1, limit: 2,
      caption: '白石のまわり（上下左右）の空きが「息」です。光っている場所をタップして、息をふさごう。' },
    { rows: ['.X...', 'XO...', '.X.X.', '..XOX', '.....'], target: 2, limit: 3,
      caption: '息が1つの石は「アタリ」です。石についた数字は息の数。2つとも取ろう。' },
    { rows: ['O....', '.....', '..X..', '.....', '...XO'], target: 2, limit: 4,
      caption: '角の石は息が2つしかありません。1手目でアタリにして、2手目で取ります。' },
    { rows: ['..X..', '.XOX.', '.....', '.XOX.', '..X..'], target: 2, limit: 2,
      caption: '1つの息を2つの石が共有しています。1手で両方取れるかも。' },
    { rows: ['.....', '.XX..', 'XOOX.', '.....', '.....'], target: 2, limit: 3,
      caption: 'つながった石は息をまとめて数えます。2手で取ろう。' }
  ];

  var GEN = [
    { N: 7, mode: 'all', groups: [2, 2], size: [1, 2], libs: [1, 2], shared: 0.35, decoys: 3, slack: 2, maxCand: 12 },
    { N: 7, mode: 'all', groups: [3, 3], size: [1, 2], libs: [1, 2], shared: 0.5, decoys: 3, slack: 2, maxCand: 12 },
    { N: 7, mode: 'optimal', groups: [3, 3], size: [1, 2], libs: [1, 3], shared: 0.4, decoys: 3, slack: 1, deficit: [1, 1], maxCand: 14 },
    { N: 7, mode: 'all', groups: [3, 4], size: [1, 3], libs: [1, 2], shared: 0.55, decoys: 4, slack: 1, maxCand: 14 },
    { N: 9, mode: 'optimal', groups: [3, 4], size: [1, 3], libs: [1, 3], shared: 0.4, decoys: 5, slack: 1, deficit: [1, 2], maxCand: 14 },
    { N: 9, mode: 'all', groups: [4, 4], size: [1, 3], libs: [1, 2], shared: 0.5, decoys: 5, slack: 1, maxCand: 14 },
    { N: 9, mode: 'optimal', groups: [4, 5], size: [1, 3], libs: [1, 3], shared: 0.45, decoys: 6, slack: 1, deficit: [2, 2], maxCand: 16 },
    { N: 9, mode: 'optimal', groups: [5, 5], size: [1, 3], libs: [1, 3], shared: 0.45, decoys: 6, slack: 1, deficit: [2, 3], maxCand: 16 },
    { N: 9, mode: 'optimal', groups: [5, 6], size: [1, 3], libs: [1, 3], shared: 0.5, decoys: 7, slack: 0, deficit: [2, 3], maxCand: 17 },
    { N: 9, mode: 'optimal', groups: [6, 6], size: [1, 4], libs: [1, 3], shared: 0.5, decoys: 7, slack: 0, deficit: [3, 3], maxCand: 18 },
    { N: 9, mode: 'optimal', groups: [6, 7], size: [1, 4], libs: [1, 3], shared: 0.55, decoys: 8, slack: 0, deficit: [3, 4], maxCand: 18 }
  ];

  /* ステージ17〜50：少しずつ盤と白石を増やす。6面に1回は「ぜんぶ取る」で息をつける */
  (function () {
    for (var k = 0; k < 34; k++) {
      var t = k / 33;
      if (k % 6 === 5) {
        GEN.push({ N: 9, mode: 'all', groups: [4, 5], size: [1, 3], libs: [1, 2], shared: 0.5, decoys: 6, slack: 1, maxCand: 14 });
        continue;
      }
      var N = k < 10 ? 9 : 11, gLo = Math.min(N === 9 ? 8 : 12, 7 + Math.floor(t * 5));
      GEN.push({
        N: N, mode: 'optimal', groups: [gLo, gLo + 1], size: [1, t < 0.4 ? 3 : 4], libs: [1, 3], shared: 0.5,
        decoys: 8 + Math.floor(t * 3), slack: 0, deficit: [3 + Math.floor(t * 2), 4 + Math.floor(t * 2)], maxCand: 18 + Math.floor(t * 2),
        minCand: 13 + Math.floor(t * 4), parMin: 9 + Math.floor(t * 5)
      });
    }
  })();

  var STAGE_COUNT = HAND.length + GEN.length;

  function fromRows(rows) {
    var N = rows.length, cells = new Uint8Array(N * N);
    rows.forEach(function (row, r) {
      for (var c = 0; c < N; c++) {
        var ch = row.charAt(c);
        cells[r * N + c] = ch === 'X' ? BLACK : ch === 'O' ? WHITE : EMPTY;
      }
    });
    return { N: N, cells: cells };
  }

  /* 息のない黒石（まわりを白と盤のはしにかこまれた石）は置けない形なので、別の場所に移して数値を計算し直す。
     ほかのステージの盤は変えない。 */
  function repairStage(s, seed) {
    var N = s.N, NN = N * N, board = Uint8Array.from(s.cells), rnd = mulberry32(seed * 31 + 12345), moved = 0;
    for (var guard = 0; guard < 20; guard++) {
      var deadAt = -1;
      for (var di = 0; di < NN && deadAt < 0; di++) if (board[di] === BLACK && blackLibs(N, board, di) === 0) deadAt = di;
      if (deadAt < 0) break;
      board[deadAt] = EMPTY; moved++;
      for (var mv = 0; mv < 300; mv++) {
        var np = Math.floor(rnd() * NN);
        if (board[np] !== EMPTY || np === deadAt) continue;
        var nbs = neighbors(N, np);
        if (nbs.some(function (q) { return board[q] === WHITE; })) continue;
        if (!nbs.some(function (q) { return board[q] === EMPTY; })) continue;
        board[np] = BLACK; break;
      }
    }
    if (!moved) return s;
    var an = analyze(N, board), W = an.totalStones, slack = s.limit - s.par, target, par;
    if (s.mode === 'all') { target = W; par = an.cand.length; }
    else {
      var bc = bestByCount(an); par = s.par; target = bc.bestAt[par];
      if (target >= W || target <= 0) return s;
    }
    s.cells = Array.from(board); s.target = target; s.par = par; s.limit = par + slack; s.total = W; s.libsTotal = an.cand.length;
    return s;
  }

  function buildStage(i) {
    if (i < HAND.length) {
      var h = HAND[i], b = fromRows(h.rows);
      var an = analyze(b.N, b.cells), bc = bestByCount(an);
      return {
        index: i, N: b.N, cells: Array.from(b.cells), target: h.target, limit: h.limit,
        par: firstK(bc.bestAt, h.target), total: an.totalStones, libsTotal: an.cand.length,
        mode: h.target >= an.totalStones ? 'all' : 'optimal', caption: h.caption
      };
    }
    var P = GEN[i - HAND.length];
    for (var j = 0; j < 80; j++) {
      var s = generate(P, 7919 * (i + 1) + j * 131);
      if (s) {
        s.index = i; repairStage(s, 7919 * (i + 1) + j * 131);
        s.caption = s.mode === 'all'
          ? 'ぜんぶ取るのが目標です。息を共有している場所を探すと、手数が減ります。'
          : '手数が足りません。取れる石が多くなる場所を選びましょう。';
        if (i === STAGE_COUNT - 1) s.caption = '最終ステージです。ヒントを使ってもかまいません。';
        return s;
      }
    }
    throw new Error('stage generation failed: ' + i);
  }

  /* ラッシュの難しさ: レベルが上がるほど盤が大きく、白石が多く、黒石（壁）が少なく（息が多く）なる。
     打つ場所が増えるので、慣れた人でも時間がかかる。 */
  var RUSH_MAX_LEVEL = 26;
  function rushParams(n) {

/* シチョウ（追いかけ）モード: 黒白双方が打てる盤面、白の自動応手、探索による解の確認。

(function (root) {
  'use strict';
  var EMPTY = 0, BLACK = 1, WHITE = 2;

    var r = (i / N) | 0, c = i % N, out = [];

    if (r < N - 1) out.push(i + N);
    if (c > 0) out.push(i - 1);
    if (c < N - 1) out.push(i + 1);

  /* start と同じ色の連と、その息 */

    var color = b[start], stones = [], libs = new Set(), seen = new Set([start]), stack = [start];
    while (stack.length) {

        x: q.x, y: q.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, g: 520, age: 0,
        life: 0.5 + Math.random() * 0.5, size: 2.5 + Math.random() * 4.5,
        color: white ? PCOL[(Math.random() * PCOL.length) | 0] : ['#5A6090', '#8FB4FF', '#FFFFFF'][(Math.random() * 3) | 0],
        shape: Math.random() < 0.35 ? 1 : 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 18
      });
    }
  }

  function ladderPlace(p) {
    if (G.over || G.locked) return;
    var now = performance.now(), N = G.N, st = G.lad;
    if (G.board[p] !== EMPTY) {
      Sfx.invalid(); var q0 = pt(p);
      fx.rings.push({ x: q0.x, y: q0.y, t0: now, dur: 300, maxR: geo.r * 0.9, lw: 3, color: '#FF5C6C' });
      return;
    }
    var res = Ld.blackMove(st, p);
    if (!res.ok) { Sfx.invalid(); toast('そこには打てません（自殺手かコウです）。'); return; }
    G.history.push({ board: G.board.slice(), lad: cloneLad(st), score: G.score, combo: G.combo, wpath: (G.wpath || []).slice() });
    G.hint = -1;

    // 黒の一手
    G.board = res.afterBlack.slice();
    fx.born.set(p, { t0: now, delay: 0 });
    var pp = pt(p);
    fx.rings.push({ x: pp.x, y: pp.y, t0: now, dur: 380, maxR: geo.r * 1.1, lw: 3, color: 'rgba(255,255,255,.85)' });
    Sfx.place(); vibrate(8);

    if (res.outcome === 'win') {
      // 標的が取れた: 追いかけた順に、1つずつポンッ。長く追うほど音が高くなっていく
      var tr = (st.t / N) | 0, tc = st.t % N, wpath = G.wpath || [];
      var capList = res.whiteCaptured.slice().sort(function (x, y) {
        var kx = wpath.indexOf(x), ky = wpath.indexOf(y);
        var vx = kx >= 0 ? 1000 + kx : Math.abs(((x / N) | 0) - tr) + Math.abs(x % N - tc);
        var vy = ky >= 0 ? 1000 + ky : Math.abs(((y / N) | 0) - tr) + Math.abs(y % N - tc);
        return vx - vy;
      });
      var cn = capList.length, epicOn = cn >= EPIC_MIN;
      var stepMs = Math.max(28, Math.min(70, 1300 / Math.max(1, cn))), hold = epicOn ? 280 : 0;   /* 15個以上のときだけ、取る直前に一瞬ためる */
      var order = 0, sx = 0, sy = 0;
      capList.forEach(function (i) {
        var q = pt(i); sx += q.x; sy += q.y;
        fx.pops.push({ x: q.x, y: q.y, t0: now + hold + order * stepMs, white: true });
        Sfx.capture(order, Math.min(8, st.chase + 1), stepMs / 1000, hold / 1000);
        (function (ii, o) { setTimeout(function () { if (G.mode === 'ladder') burst(ii, true); }, hold + o * stepMs); })(i, order);
        order++;
      });
      sx /= order; sy /= order;
      var pts = order * 300 * (st.chase + 1);
      G.score += pts; G.lad = res.state; G.over = true; G.won = true;
      var fin = function () {
        var n2 = performance.now();
        fx.rings.push({ x: sx, y: sy, t0: n2, dur: 700, maxR: geo.cell * 3.6, lw: 8, color: '#FFD04A' });
        fx.shake = Math.max(fx.shake, 16); flash(); vibrate([20, 30, 20, 30, 40]);
        popText('シチョウ成功!', 'big'); popText('+' + fmt(pts), 'pts', sx, sy);
        if (epicOn) epic(order, sx, sy, n2, order + '子 一網打尽!!');
      };
      if (hold) setTimeout(function () { if (G.mode === 'ladder') fin(); }, hold); else fin();
      refreshGroups(); updateHudLadder(true);
      G.timer = setTimeout(finishLadder, (epicOn ? 2800 : 1500) + (cn * stepMs > 1000 ? 300 : 0));
      return;
    }

    // アタリ表示（白が応手する前の状態）
    G.locked = true;
    var tg = Ld.groupOf(N, G.board, st.t);
    if (tg.libs.length === 1) {
      var np = pt(st.t); Sfx.atari(); popText('アタリ!', 'warn', np.x, np.y - geo.cell * 0.2);
    }
    refreshGroups(); updateHudLadder(false);

    // 白の応手（少し間を置く）
    G.timer = setTimeout(function () {
      var t1 = performance.now();
      G.board = res.board.slice(); G.lad = res.state;
      if (res.whiteMove >= 0) {
        (G.wpath || (G.wpath = [])).push(res.whiteMove);
        var wp = pt(res.whiteMove);
        fx.born.set(res.whiteMove, { t0: t1, delay: 0 });
        fx.rings.push({ x: wp.x, y: wp.y, t0: t1, dur: 380, maxR: geo.r * 1.1, lw: 3, color: 'rgba(255,255,255,.7)' });
        Sfx.whiteStep();
      }
      var k = 0;
      res.blackCaptured.forEach(function (i) {
        var q = pt(i); fx.pops.push({ x: q.x, y: q.y, t0: t1 + k * 50, white: false }); burst(i, false); k++;
      });
      if (k) { popText('取られた!', 'warn', geo.S * 0.5, geo.S * 0.5); fx.shake = Math.max(fx.shake, 8); }
      refreshGroups();
      if (res.outcome === 'escaped') {
        G.over = true; G.locked = false; Sfx.fail(); fx.shake = Math.max(fx.shake, 10);
        var tp = pt(G.lad.t); fx.rings.push({ x: tp.x, y: tp.y, t0: t1, dur: 600, maxR: geo.cell * 3, lw: 6, color: '#FF5C6C' });
        updateHudLadder(true);
        G.timer = setTimeout(showLadderFail, 900);
        return;
      }
      var chase = G.lad.chase, pts2 = 100 * chase; G.score += pts2; G.combo = chase;
      Sfx.capture(0, Math.min(9, chase));
      if (res.whiteMove >= 0) { var wq = pt(res.whiteMove); popText('+' + fmt(pts2), 'pts', wq.x, wq.y); }
      G.locked = false; updateHudLadder(true);
    }, reduceMotion ? 120 : 430);
  }

  function ladderUndo() {
    if (!G.history.length || G.won) return;
    clearTimeout(G.timer); closeModal();
    var h = G.history.pop();
    G.board = h.board; G.lad = h.lad; G.score = h.score; G.combo = h.combo; G.wpath = h.wpath ? h.wpath.slice() : [];
    G.over = false; G.locked = false; G.hint = -1; fx.pops.length = 0; G.undos++;
    Sfx.undo(); refreshGroups(); updateHudLadder(false);
  }

  function ladderHint() {
    if (G.over || G.locked) return;
    var h = (G.lad.moves === 0 && G.ladSol && G.ladSol.length) ? G.ladSol[0][0] : Ld.hint(G.lad);
    if (h < 0) { toast('ここからは取れません。「1手戻す」を使ってみよう。'); Sfx.invalid(); return; }
    G.hint = h; G.hintUntil = performance.now() + 4500; G.hints++; Sfx.hint();
  }

  function finishLadder() {
    var stars = G.hints === 0 && G.undos === 0 ? 3 : G.hints === 0 ? 2 : 1;
    G.score += 500;
    track('oikake/problem-' + pad2(G.lidx + 1) + '-clear');
    if (stars > (save.lad2[G.lidx] || 0)) save.lad2[G.lidx] = stars;
    persist();
    var last = G.lidx >= Ld.stageCount() - 1;
    var LDt = window.PongoLadderData || [], LVt = window.PongoLadderLevels || [], curLv = LDt[G.lidx] && LDt[G.lidx].lv;
    var lvEnd = !!curLv && (last || !LDt[G.lidx + 1] || LDt[G.lidx + 1].lv !== curLv), shareHtml = '';
    if (lvEnd) {
      var lvName = (LVt[curLv - 1] || {}).t || '', lvStars = 0, lvCount = 0;
      LDt.forEach(function (d, k) { if (d.lv === curLv) { lvCount++; lvStars += save.lad2[k] || 0; } });
      var allStars = 0; LDt.forEach(function (d, k) { allStars += save.lad2[k] || 0; });
      var shareText = last ? 'おいかけっ碁の全' + LDt.length + '問をクリア！星 ' + allStars + ' / ' + LDt.length * 3 + '\n白をななめに追いかけて取る、囲碁のパズルです。' : 'おいかけっ碁 レベル' + curLv + '「' + lvName + '」を全部クリア！星 ' + lvStars + ' / ' + lvCount * 3 + '\n白をななめに追いかけて取る、囲碁のパズルです。';
      shareHtml = xBtn(shareText, 'おいかけっ碁,囲碁');
    }
    var title = last ? 'ぜんぶ追いきった!' : stars === 3 ? 'パーフェクト!' : 'シチョウ成功!';
    var sub = stars === 3 ? 'ヒントも戻しも使わずに追いきりました。' : stars === 2 ? '戻しを使わなければ星3つです。' : 'ヒントなしで追えると星が増えます。';
    openModal('<h2>' + title + '</h2><div class="bigstars">' + '<svg><use href="#i-star"/></svg>'.repeat(3) + '</div>' +
      '<p class="sub">' + sub + '</p>' +
      '<div class="resline"><span>追いかけ</span><b>' + G.lad.chase + ' 手</b></div>' +
      '<div class="resline"><span>スコア</span><b id="res-score">0</b></div><div class="btns">' +
      (last ? '' : '<button class="btn btn-gold" type="button" data-act="lnext">次の問題</button>') + shareHtml +
      '<button class="btn btn-ghost" type="button" data-act="lretry">もう一回</button>' +
      '<button class="btn btn-ghost" type="button" data-act="home">ホームへ</button></div>');
    Sfx.win();
    var svgs = card.querySelectorAll('.bigstars svg');
    for (var i = 0; i < stars; i++) (function (k) { setTimeout(function () { if (svgs[k]) { svgs[k].classList.add('on'); Sfx.star(k); } }, 380 + k * 380); })(i);
    countUp($('#res-score'), G.score, 1000);
    confettiBurst(stars === 3 ? 150 : 80);
  }

  function showLadderFail() {
    openModal('<h2>逃げられた!</h2><p class="sub">白の息が3つ以上になりました。ここからは追いかけが続きません。</p>' +
      '<p class="sub">「ひとつ戻す」で打ち直せます。逃げる先と、盤の石の位置を見てみよう。</p><div class="btns">' +
      '<button class="btn btn-gold" type="button" data-act="lundo">ひとつ戻す</button>' +
      '<button class="btn btn-ghost" type="button" data-act="lretry">最初からやり直す</button>' +
      '<button class="btn btn-ghost" type="button" data-act="home">ホームへ</button></div>');
  }

  /* ---------- フレームループ ---------- */
  var last = performance.now(), scoreEl = $('#score');
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
    if (!screens.play.hidden) {
      updateFx(dt); draw(now); tickRush(now);
      if (dispScore !== G.score) {
        var dd = (G.score - dispScore) * Math.min(1, dt * 7);
        dispScore += dd >= 0 ? Math.max(1, dd) : Math.min(-1, dd);
        if (Math.abs(G.score - dispScore) < 1.5) dispScore = G.score;
        scoreEl.textContent = fmt(dispScore);
      }
    }
    confettiFrame(dt);
  }

  /* ---------- 入力 ---------- */
  var down = null;
  cv.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY }; Sfx.unlock(); });
  cv.addEventListener('pointerup', function (e) {
    if (!down) return;
    var d = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if (d > 12) return;
    var p = hit(e); if (p >= 0) place(p);
  });
  cv.addEventListener('pointercancel', function () { down = null; });
  cv.addEventListener('pointermove', function (e) { if (e.pointerType === 'touch') return; G.hover = hit(e); });
  cv.addEventListener('pointerleave', function () { G.hover = -1; });
  document.addEventListener('pointerdown', function () { Sfx.unlock(); }, { passive: true });

  if (PAGE === 'oikake') {
    $('#grid-ladder').addEventListener('click', function (e) {
      var t = e.target.closest('.tile'); if (t) startLadder(parseInt(t.getAttribute('data-l'), 10));
    });
    $('#btn-play').addEventListener('click', function () { startLadder(nextLadder()); });
    window.OikakeBasic.renderAll($('#basic-body'));
    window.OikakeBasic.hero($('.hero-art'));
    $('#btn-basic').addEventListener('click', function () { track('oikake/basic-open'); show('basic'); });
    $('#btn-basic-back').addEventListener('click', function () { show('home'); });
    $('#basic-go').addEventListener('click', function () { startLadder(nextLadder()); });
  } else {
    $('#grid').addEventListener('click', function (e) {
      var t = e.target.closest('.tile'); if (t) startStage(parseInt(t.getAttribute('data-i'), 10));
    });
    $('#btn-play').addEventListener('click', function () { startStage(nextStage()); });
    $('#btn-rush').addEventListener('click', startRush);
  }
  $('#btn-back').addEventListener('click', goHome);
  $('#btn-undo').addEventListener('click', undo);
  $('#btn-hint').addEventListener('click', doHint);
  $('#btn-retry').addEventListener('click', retry);
  function syncToggles() {
    $('#btn-sound').setAttribute('aria-pressed', String(!save.mute));
    $('#ic-sound-on').hidden = save.mute; $('#ic-sound-off').hidden = !save.mute;
    $('#btn-guide').setAttribute('aria-pressed', String(guideOn()));
  }
  $('#btn-sound').addEventListener('click', function () { save.mute = !save.mute; persist(); syncToggles(); if (!save.mute) Sfx.place(); });
  $('#btn-guide').addEventListener('click', function () {
    if (G.mode === 'rush') save.rushGuide = !save.rushGuide; else if (G.mode === 'ladder') save.ladGuide = !save.ladGuide; else save.guide = !save.guide;
    persist(); syncToggles();
  });

  var cross = $('#cross');
  if (cross && /github\.io$/.test(location.hostname)) cross.hidden = false;
  syncToggles(); renderHome(); requestAnimationFrame(frame);
})();
</script>

</body>
