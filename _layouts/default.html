<!doctype html>
<html lang="{{ page.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: 'ZukanoLab official website' }}">
    <title>{{ page.title | default: 'ZukanoLab' }} | ZukanoLab</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">ZukanoLab</a>
        {% if page.alternate_url %}
          <a class="language-link" href="{{ page.alternate_url | relative_url }}">{{ page.alternate_label }}</a>
        {% endif %}
      </div>
    </header>
    <main class="page">
      <article class="content{% if page.home %} home{% endif %}">
        {{ content }}
      </article>
    </main>
    <footer class="site-footer">&copy; 2026 ZukanoLab</footer>
  </body>
</html>
